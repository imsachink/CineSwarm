name: Build CineSwarm (Windows & macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install --save-dev electron-builder

      - name: Build Windows .exe (Installer & Portable)
        run: npm run dist -- --win

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: CineSwarm-Windows
          path: dist/*.exe

